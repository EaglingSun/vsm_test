# PR 테스트 리포트 (ADR-003) — 로컬과 같은 gcc · 같은 make.cmd 경로로 C 테스트를 돌리고
# SR 별 요약 표($GITHUB_STEP_SUMMARY)와 JUnit XML 아티팩트를 남긴다.
# CI 는 실제 결과를 보여 주는 곳이라 --expect(알려진 실패 대조)를 쓰지 않는다 — 결함판에서는 빨간 표시가 맞다.
# action 은 GitHub 공식 것만, 커밋 SHA 로 고정한다(공개 저장소 공급망 위험). 구조 검사: tests/test_ci_workflow.py
name: test

on:
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      # 키 = setup/setup_gcc.ps1 의 $Sha256 — 받는 파일이 바뀌면 캐시도 바뀐다
      # 복원 · 저장을 나눈다(ADR-003) — actions/cache 한 step 은 job 이 성공해야 저장하는데, 결함판 PR 은 늘 실패한다
      - name: gcc 캐시 복원
        id: gcc-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: C:\Users\Public\vsm-gcc
          key: vsm-gcc-ED7FB2DB387834849AF00216A609D36B3D65730BA28CA73C7D759360EDAEB913

      # 캐시가 있으면 스크립트가 .setup-ok 를 보고 건너뛴다
      - name: gcc 받기
        run: powershell -NoProfile -ExecutionPolicy Bypass -File setup\setup_gcc.ps1

      # C 테스트보다 앞 — 테스트가 실패해도 캐시는 남는다. 같은 키가 이미 있으면 저장이 실패하므로 캐시가 없었을 때만
      - name: gcc 캐시 저장
        if: steps.gcc-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: C:\Users\Public\vsm-gcc
          key: vsm-gcc-ED7FB2DB387834849AF00216A609D36B3D65730BA28CA73C7D759360EDAEB913

      # 테스트가 실패하면 이 step 과 job 이 실패한다(그대로 둔다)
      - name: C 테스트
        id: test
        shell: cmd
        run: .\make.cmd test

      # 실패한 PR 이야말로 결과 표가 필요하다 — 앞 step 이 실패해도 돈다
      - name: 요약 표
        if: ${{ !cancelled() }}
        run: python tests/check_junit.py test-results --summary "$env:GITHUB_STEP_SUMMARY"

      # XML 이 하나도 없으면 빌드가 깨진 것이다 — 빈 아티팩트로 통과시키지 않는다
      - name: JUnit XML 아티팩트
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: junit-xml
          path: test-results/*.xml
          if-no-files-found: error
